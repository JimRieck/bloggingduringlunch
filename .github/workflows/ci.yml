name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        working-directory: src/web
        run: npm ci

      - name: Lint
        working-directory: src/web
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        working-directory: src/web
        run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      # Fresh Postgres + every migration in supabase/migrations, same as
      # local dev's `npx supabase start` followed by `db reset` -- every
      # CI run gets a brand-new runner, so there's no existing volume
      # for `start` to restore from, but `db reset` makes the "apply
      # every migration cleanly" step explicit rather than assumed.
      - name: Start local Supabase
        run: |
          supabase start
          supabase db reset

      # These are the Supabase CLI's fixed, publicly documented local
      # dev keys (same for every local install using the default
      # config.toml JWT settings, and already written in plain text in
      # src/web/.env.test.example) -- not secrets, only ever valid
      # against the ephemeral local stack this job just started and
      # tears down when it ends.
      - name: Run integration tests
        working-directory: src/web
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
        run: npm test

  # Only runs on an actual push to main (never a PR, never another
  # branch) or a manual dispatch against main, and only after lint+test
  # both pass -- deliberately
  # sequential end to end: hosted Supabase schema/functions before the
  # frontend that expects them, matching the ordering this project
  # followed by hand for every deploy so far. Vercel's own GitHub
  # git-integration auto-deploy must be turned off for this to actually
  # hold (see the Deployment & ops entry in ROADMAP.md) -- otherwise
  # Vercel's push-triggered deploy races ahead of this job, which
  # always takes longer since it waits on tests first.
  deploy:
    needs: [lint, test]
    # `secrets` isn't allowed in a job-level `if:` (the whole workflow
    # fails to parse if you try -- learned that the hard way), so this
    # job WILL show as failed on every push to main until the five
    # secrets below actually exist. That's expected: ignore the red X
    # on "deploy" specifically until the one-time setup is done: lint
    # and test are unaffected either way.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      - name: Deploy Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # `--project-ref` alone hit a known CLI/API auth bug --
          # "Your account does not have the necessary privileges" on
          # `supabase link` even for a project owner with a fully-
          # privileged token (supabase/cli#3705). Setting the ref as
          # an env var too, not just a CLI arg, is the workaround that
          # resolved it for other reporters.
          SUPABASE_PROJECT_REF: bcgvmvfndwubqfrxqopa
        run: |
          supabase link --project-ref bcgvmvfndwubqfrxqopa
          supabase db push

      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: bcgvmvfndwubqfrxqopa
        run: supabase functions deploy --project-ref bcgvmvfndwubqfrxqopa

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Deliberately run from the repo root, NOT src/web: the Vercel
      # project's own Root Directory setting is already "src/web" (set
      # in its dashboard), and `vercel pull` downloads that setting.
      # Running these commands from inside src/web too would apply it
      # twice, producing src/web/src/web -- confirmed by a real failed
      # run: "the provided path .../src/web/src/web does not exist".
      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
